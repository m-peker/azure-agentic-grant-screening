{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<div class="card empty" style="max-width:520px;margin:48px auto">
  <div style="font-size:44px;font-weight:700;color:var(--faint)">{{ code }}</div>
  <p style="font-size:16px;color:var(--fg)">{{ message or 'Bir sorun oluştu.' }}</p>
  <a class="btn" href="/">Başvurulara dön</a>
</div>
{% endblock %}
